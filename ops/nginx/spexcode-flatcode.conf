# Flatcode gallery — flatcode.spexcode.net
#
# One host carrying MANY flats, each at /<owner>/<repo>/. That is why the artifact is relocatable: every
# flat names its assets, payload and archive relative to its own directory, so the same bytes serve here
# and from a domain root. The gallery index lives at /.
#
# TLS is terminated at the Cloudflare edge (the zone holds a *.spexcode.net certificate), so the origin
# speaks plain HTTP on :80 exactly like the sibling publications on this host.
server {
    listen 80;
    listen [::]:80;
    server_name flatcode.spexcode.net;

    root /var/www/spexcode-flatcode/site;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # A flat's bundle filenames are content-addressed, so they are safe to cache forever. They sit under each
    # flat's OWN directory rather than at the root, which is what distinguishes this host from a single
    # publication: the pattern has to match /<owner>/<repo>/assets/…, not /assets/.
    location ~ ^/.+/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # A directory MUST redirect to its slashed form before anything renders: the page resolves `./specs/x.json`
    # against its own URL, so at /psf/requests (no slash) the browser would ask for /psf/specs/x.json. nginx
    # issues that 301 itself when try_files falls through to $uri/ — the `absolute_redirect off` keeps it on
    # the request's own scheme/host instead of inventing one behind the edge proxy.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
