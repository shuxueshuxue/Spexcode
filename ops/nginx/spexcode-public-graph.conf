server {
    listen 80;
    listen [::]:80;
    server_name spexcode.spexcode.net;

    root /var/www/spexcode-public-graphs/spexcode/site;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}

# The former trial alias never owns a repository. Keep old links useful while making the
# repository-to-host registry's ownership unambiguous.
server {
    listen 80;
    listen [::]:80;
    server_name herdr.spexcode.net;
    return 308 https://spexcode.spexcode.net$request_uri;
}
