<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1400" height="460" fill="#F4EEE0"/>
  <defs>
    <marker id="warr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16495A"/>
    </marker>
  </defs>

  <!-- top row: 01..04, left to right -->
  <g>
    <rect x="40" y="60" width="290" height="120" rx="16" fill="#FFFDF6" stroke="#16495A" stroke-width="2.5"/>
    <text x="66" y="100" font-size="17" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" fill="#8A8272">01</text>
    <text x="66" y="132" font-size="20" font-weight="700" fill="#171A20">dispatch</text>
    <text x="66" y="160" font-size="15" fill="#5C5647">fresh worktree, branch, session</text>
  </g>
  <path d="M 334 120 L 380 120" stroke="#16495A" stroke-width="3" marker-end="url(#warr)" fill="none"/>

  <g>
    <rect x="384" y="60" width="290" height="120" rx="16" fill="#FFFDF6" stroke="#16495A" stroke-width="2.5"/>
    <text x="410" y="100" font-size="17" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" fill="#8A8272">02</text>
    <text x="410" y="132" font-size="20" font-weight="700" fill="#171A20">read the governing spec</text>
    <text x="410" y="160" font-size="15" fill="#5C5647">the contract, before the code</text>
  </g>
  <path d="M 678 120 L 724 120" stroke="#16495A" stroke-width="3" marker-end="url(#warr)" fill="none"/>

  <g>
    <rect x="728" y="60" width="290" height="120" rx="16" fill="#FFFDF6" stroke="#16495A" stroke-width="2.5"/>
    <text x="754" y="100" font-size="17" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" fill="#8A8272">03</text>
    <text x="754" y="132" font-size="20" font-weight="700" fill="#171A20">do the work</text>
    <text x="754" y="160" font-size="15" fill="#5C5647">code and spec change together</text>
  </g>
  <path d="M 1022 120 L 1068 120" stroke="#16495A" stroke-width="3" marker-end="url(#warr)" fill="none"/>

  <g>
    <rect x="1072" y="60" width="290" height="120" rx="16" fill="#FFFDF6" stroke="#16495A" stroke-width="2.5"/>
    <text x="1098" y="100" font-size="17" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" fill="#8A8272">04</text>
    <text x="1098" y="132" font-size="20" font-weight="700" fill="#171A20">run the eval scenarios</text>
    <text x="1098" y="160" font-size="15" fill="#5C5647">measure on the real product</text>
  </g>

  <!-- turn: 04 down to 05 -->
  <path d="M 1217 184 L 1217 236" stroke="#16495A" stroke-width="3" marker-end="url(#warr)" fill="none"/>

  <!-- bottom row: 05..08, right to left -->
  <g>
    <rect x="1072" y="240" width="290" height="120" rx="16" fill="#FFFDF6" stroke="#16495A" stroke-width="2.5"/>
    <text x="1098" y="280" font-size="17" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" fill="#8A8272">05</text>
    <text x="1098" y="312" font-size="20" font-weight="700" fill="#171A20">clear drift, pass lint</text>
    <text x="1098" y="340" font-size="15" fill="#5C5647">spec still describes the code</text>
  </g>
  <path d="M 1068 300 L 1022 300" stroke="#16495A" stroke-width="3" marker-end="url(#warr)" fill="none"/>

  <g>
    <rect x="728" y="240" width="290" height="120" rx="16" fill="#FFFDF6" stroke="#16495A" stroke-width="2.5"/>
    <text x="754" y="280" font-size="17" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" fill="#8A8272">06</text>
    <text x="754" y="312" font-size="20" font-weight="700" fill="#171A20">commit, propose merge</text>
    <text x="754" y="340" font-size="15" fill="#5C5647">workers never merge themselves</text>
  </g>
  <path d="M 724 300 L 678 300" stroke="#16495A" stroke-width="3" marker-end="url(#warr)" fill="none"/>

  <g>
    <rect x="384" y="240" width="290" height="120" rx="16" fill="#FFFDF6" stroke="#171A20" stroke-width="2.5"/>
    <text x="410" y="280" font-size="17" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" fill="#8A8272">07</text>
    <text x="410" y="312" font-size="20" font-weight="700" fill="#171A20">you review, fire the merge</text>
    <text x="410" y="340" font-size="15" fill="#5C5647">the session’s own agent lands it</text>
  </g>
  <path d="M 380 300 L 334 300" stroke="#16495A" stroke-width="3" marker-end="url(#warr)" fill="none"/>

  <g>
    <rect x="40" y="240" width="290" height="120" rx="16" fill="#FFFDF6" stroke="#171A20" stroke-width="2.5"/>
    <text x="66" y="280" font-size="17" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" fill="#8A8272">08</text>
    <text x="66" y="312" font-size="20" font-weight="700" fill="#171A20">close</text>
    <text x="66" y="340" font-size="15" fill="#5C5647">session retired, worktree gone</text>
  </g>

  <text x="40" y="424" font-size="15" fill="#5C5647">steps 01–06 are the worker’s; 07 is the one human gate. Independent tasks run this loop in parallel, one worktree each.</text>
</svg>
