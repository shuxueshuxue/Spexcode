<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1400" height="560" fill="#F4EEE0"/>
  <defs>
    <marker id="darr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#171A20"/>
    </marker>
  </defs>

  <text x="48" y="58" font-size="24" font-weight="700" fill="#171A20">when the spec goes stale — drift, judged from git alone</text>

  <!-- timeline -->
  <line x1="80" y1="200" x2="1340" y2="200" stroke="#171A20" stroke-width="3" marker-end="url(#darr)"/>
  <text x="1270" y="176" font-size="16" fill="#5C5647">commits →</text>

  <!-- commit 1: spec + code together -->
  <circle cx="220" cy="200" r="14" fill="#16495A"/>
  <line x1="220" y1="214" x2="220" y2="262" stroke="#16495A" stroke-width="2"/>
  <rect x="96" y="262" width="268" height="130" rx="10" fill="#FFFDF6" stroke="#16495A" stroke-width="2"/>
  <text x="118" y="294" font-size="17" font-weight="700" fill="#16495A">spec v12 lands</text>
  <g font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#171A20">
    <text x="118" y="322">✓ spec.md</text>
    <text x="118" y="346">✓ src/uploader.ts</text>
  </g>
  <text x="118" y="376" font-size="14" font-style="italic" fill="#5C5647">spec and code move together</text>

  <!-- commit 2: unrelated code -->
  <circle cx="600" cy="200" r="12" fill="#FFFDF6" stroke="#171A20" stroke-width="3"/>
  <line x1="600" y1="214" x2="600" y2="262" stroke="#8A8272" stroke-width="2"/>
  <rect x="476" y="262" width="268" height="130" rx="10" fill="#FFFDF6" stroke="#8A8272" stroke-width="1.5"/>
  <text x="498" y="294" font-size="17" font-weight="700" fill="#5C5647">code-only commit</text>
  <g font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#171A20">
    <text x="498" y="322">✓ src/uploader.ts</text>
    <text x="498" y="346" fill="#8A8272">  (misses retry())</text>
  </g>
  <text x="498" y="376" font-size="14" font-style="italic" fill="#5C5647">anchored unit untouched → advisory</text>

  <!-- drift warn flag on commit 2 -->
  <rect x="486" y="118" width="228" height="44" rx="8" fill="#EFE8D8" stroke="#8A8272" stroke-width="1.5"/>
  <text x="506" y="147" font-size="16" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" fill="#5C5647">drift <tspan fill="#8A8272">(warn)</tspan></text>
  <line x1="600" y1="162" x2="600" y2="186" stroke="#8A8272" stroke-width="2"/>

  <!-- commit 3: hits the anchor -->
  <circle cx="980" cy="200" r="12" fill="#A03123"/>
  <line x1="980" y1="214" x2="980" y2="262" stroke="#A03123" stroke-width="2"/>
  <rect x="856" y="262" width="268" height="130" rx="10" fill="#FFFDF6" stroke="#A03123" stroke-width="2.5"/>
  <text x="878" y="294" font-size="17" font-weight="700" fill="#A03123">code-only commit</text>
  <g font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#171A20">
    <text x="878" y="322">✓ src/uploader.ts</text>
    <text x="878" y="346" fill="#A03123">  edits retry() itself</text>
  </g>
  <text x="878" y="376" font-size="14" font-style="italic" fill="#5C5647">anchored lines intersected → blocks</text>

  <!-- anchor-drift error flag -->
  <rect x="866" y="118" width="248" height="44" rx="8" fill="#A03123"/>
  <text x="886" y="147" font-size="16" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" fill="#F4EEE0">anchor-drift <tspan fill="#E8C0B8">(error)</tspan></text>
  <line x1="980" y1="162" x2="980" y2="186" stroke="#A03123" stroke-width="2"/>

  <!-- remedy -->
  <rect x="1160" y="242" width="192" height="170" rx="10" fill="#171A20"/>
  <text x="1182" y="276" font-size="16" font-weight="700" fill="#5FA8BE">the way out</text>
  <text x="1182" y="308" font-size="15" fill="#EFE8D8">update the spec</text>
  <text x="1182" y="330" font-size="14" fill="#8A8272">(a new version)</text>
  <text x="1182" y="362" font-size="15" fill="#EFE8D8">or ack with a reason</text>
  <text x="1182" y="386" font-size="14" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" fill="#5FA8BE">spex spec ack</text>
  <path d="M 1124 327 L 1152 327" stroke="#171A20" stroke-width="2.5" marker-end="url(#darr)" fill="none"/>

  <!-- algorithm caption -->
  <rect x="48" y="452" width="1304" height="72" rx="10" fill="#FBF7EC" stroke="#171A20" stroke-width="1.5"/>
  <text x="76" y="482" font-size="17" fill="#171A20"><tspan font-weight="700">the check is mechanical:</tspan> compare the commit that last versioned the spec against every later commit that intersects the anchored unit’s lines,</text>
  <text x="76" y="508" font-size="17" fill="#171A20">judged from the file as it existed at each commit. It never guesses at meaning — it only knows the spec no longer describes the code.</text>
</svg>
