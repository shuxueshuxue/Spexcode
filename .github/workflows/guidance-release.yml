name: publish-guidance-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.spec/spexcode/.plugins/**'
      - 'spec-cli/bin/spex.mjs'
      - 'spec-cli/src/guidance-catalog.ts'
      - 'spec-cli/src/git.ts'
      - 'spec-cli/src/guide.ts'
      - 'spec-cli/src/help.ts'
      - 'spec-cli/src/specs.ts'
      - 'scripts/guidance-release.mjs'

jobs:
  publish:
    if: vars.SPEXCODE_GUIDANCE_RELEASE_PUBLISH == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      group: guidance-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install packed root
        run: npm ci
      - name: Install spec-cli
        working-directory: spec-cli
        run: npm ci
      - name: Emit sealed guidance assets
        env:
          GUIDANCE_RELEASE_TAG: guidance-${{ github.sha }}
        run: >-
          node scripts/guidance-release.mjs
          --out-dir .guidance-release
          --repository "$GITHUB_REPOSITORY"
          --release "$GUIDANCE_RELEASE_TAG"
          --revision "$GITHUB_SHA"
      - name: Create or validate immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GUIDANCE_RELEASE_TAG: guidance-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          expected=(.guidance-release/*.json)
          if [ "${#expected[@]}" -ne 2 ]; then
            echo "expected exactly two generated guidance assets" >&2
            exit 1
          fi
          if gh release view "$GUIDANCE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$GUIDANCE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$draft" != false ]; then
              echo "release $GUIDANCE_RELEASE_TAG is a draft, not a published immutable release" >&2
              exit 1
            fi
            target="$(gh release view "$GUIDANCE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "release $GUIDANCE_RELEASE_TAG targets $target, not $GITHUB_SHA" >&2
              exit 1
            fi
            mapfile -t published < <(gh release view "$GUIDANCE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
            mapfile -t expected_names < <(printf '%s\n' "${expected[@]##*/}" | sort)
            if [ "${published[*]}" != "${expected_names[*]}" ]; then
              echo "release asset names differ from the generated pair" >&2
              exit 1
            fi
            mkdir downloaded
            for asset in "${expected_names[@]}"; do
              gh release download "$GUIDANCE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir downloaded
              cmp -- ".guidance-release/$asset" "downloaded/$asset"
            done
          else
            gh release create "$GUIDANCE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Guidance $GITHUB_SHA" --notes "Immutable guidance catalog for $GITHUB_SHA." --latest=false \
              "${expected[@]}"
          fi
